<!DOCTYPE html>
<html>
<head>
    <title>累产油产水现状图</title>
    <meta charset="utf-8">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <style type="text/css">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
        body {
            width: 100%;
            height: 100%;
            margin-left: 0px;
            margin-top: 0px;
            margin-right: 0px;
            margin-bottom: 0px;
            font-family: "宋体";
            font-size: 12px;
            color: #000000;
        }

        #container, #canvasTool_frameCanvas {
            width: 100%;
            height: 100%;
        }

        div#progressBar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            vertical-align: middle;
            text-align: center;
            background-color: rgba(236, 236, 236, 0.5);
        }
    </style>

    <script src="../jquery/jquery.min.js"></script>
    <script src="../jquery/jquery.easyui.min.js"></script>
    <link href="../Scripts/spectrum.css" rel="stylesheet" type="text/css"/>
    <script src="../Scripts/spectrum.js"></script>
    <script src="../../require.js"></script>
    <script src="../Com/WGRightMenu.js" type="text/javascript"></script>
    <script src="../Com/WGADComHead.js" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="../jquery/themes/default/easyui.css">
    <link href="../jquery/themes/icon.css" rel="stylesheet" type="text/css"/>
    <link href="../css/propertySetting.css" rel="stylesheet" type="text/css"/>
    <link href="../css/btn_pointer.css" rel="stylesheet" type="text/css"/>
    <link href="../css/buttonsIco.css" rel="stylesheet" type="text/css"/>
    <script type="text/javascript">
        var fView;
        requirejs.config({
            baseUrl: '../',
            paths: {
                myCanvas: 'jquery/myCanvas',
                "WGAD": '.'
            },
            shim: {
                'myCanvas': [],
                'WGAD/Scripts/WGADPlatGraph2D/WGADPlatGraph2D': [],
                'WGAD/Scripts/WGADPlatGMEngineTools/WGADPlatGMEngineTools': [],
            }
        });
        var deps = [
            'myCanvas',
            'WGAD/Scripts/WGADPlatConfig/WGADPlatConfig',
            'WGAD/Scripts/WGADPlatGMEngine',
            'WGAD/Scripts/WGADPlatGMEngineTools',
            'WGAD/Scripts/WGADPlatGraph2D',
            'WGAD/Scripts/WGADPlatGraph2DFrame',
            'WGAD/Scripts/WGADPlatSystemTools',
            'WGAD/Com/WGADPlatComFrame',
            'WGAD/Com/com-common'
        ];

        require(deps, function (mc,
                                WGADPlatConfig,
                                WGADPlatGMEngine,
                                WGADPlatGMEngineTools,
                                WGADPlatGraph2D,
                                WGADPlatGraph2DFrame,
                                WGADPlatSystemTools,
                                Com,
                                commonJs
        ) {
            $(function () {
                $(document).bind('contextmenu', function (e) { return false });
                document.getElementById("frameCanvas").width = $("#container").width();
                document.getElementById("frameCanvas").height = $("#container").height() - $(".panel-header").outerHeight(true);

                var viewSetting = {};
                viewSetting.CanvasID = "frameCanvas";
                viewSetting.CanvasStyle = "Html5 Canvas 2D";
                fView = new Com.WGADPlatComFrame(viewSetting,this);
                fCommon=new commonJs.ViewCommonJs(fView,this);
                /*$.ajax({
                    url: "../data/backimghis.json",
                    contentType: 'utf-8',
                    async: false,
                    dataType: 'json',
                    success: function (data) {
                        //底图和点列 data：数据，支持底图加线，或者只底图或者只线；zoom：全图，不赋值时默认全图；deleteObj：删除图中已有图元，不赋值时默认不删除
                        fView.RefreshData(data);
                    }
                });*/

                $(window).resize(function () {
                    fView.View.MapCanvas.width = $("#container").width();
                    fView.View.MapCanvas.height = $("#container").height()-$(".panel-header"). outerHeight(true);
                    fView.View.m_clientRect.Left = 0;
                    fView.View.m_clientRect.Right = fView.View.MapCanvas.width;
                    fView.View.m_clientRect.Top = 0;
                    fView.View.m_clientRect.Bottom = fView.View.MapCanvas.height;
                    fView.View.ScrollView(fView.View.HScrollValue, fView.View.VScrollValue);
                    fView.ZoomPicture();
                    fView.View.Repaint();
                });

                window.fView = fView;
                // window.RefreshData = fView.RefreshData;
                if(parent.initSampleData){
                    parent.initSampleData(undefined, $, window)
                }
            });
        });

        // 只更新线，删除前次的线，data只给线的数据
        // fView.RefreshData(data, false, true);

        // 更新底图，不删除前面画上的线，data只给底图的信息
        // 更新底图，不删除前面画上的线，并且增加新线，data给底图和线的数据
        // fView.RefreshData(data, true, false);

        // 更新底图，删除前面画上的线，data只给底图的信息
        // 更新底图，删除前面画上的线，并且增加新线，data给底图和线的数据
        // fView.RefreshData(data, true, true);

    </script>

    <style>
        .panel-title {
            font-size: 11px! important;
            height: 25px! important;
            line-height: 25px! important;
        }

        .panel-tool {
            font-size: 11px! important;
            height: 25px! important;
            line-height: 25px! important;
            padding-bottom: 5px;
            top: 50%
        }

        .panel:nth-child(1) {
            height: 100%
        }
    </style>
</head>

<body>

<div id="container"  title="小层平面图"  style="width: 100%;height: 100%;overflow: hidden;border:none;">
    <div id="canvasTool_frameCanvas">
        <canvas id="frameCanvas" tabindex="1" width="1000px" height="500px" style="outline: aquamarine;"></canvas>
    </div>
</div>
</body>
</html>
