server {
    listen       80;

    #解决Router(mode: 'history')模式下，刷新路由地址不能找到页面的问题.
    location / {
      root   /var/www/;
      index  index.html index.htm;
      if (!-e $request_filename) {
          rewrite ^(.*)$ /index.html?s=$1 last;
          break;
      }
    }
    access_log  /var/log/nginx/access.log ;
}
